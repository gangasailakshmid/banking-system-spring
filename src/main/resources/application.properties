spring.application.name=banking-system-spring
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp
spring.main.banner-mode=off
server.port=${PORT:8081}
server.servlet.session.timeout=15m
banking.mysql.url=${MYSQL_URL:jdbc:mysql://localhost:3306/banking_spring_personal?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false}
banking.mysql.username=${MYSQL_USERNAME:root}
banking.mysql.password=${MYSQL_PASSWORD:}
banking.postgres.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/banking_spring_bank}
banking.postgres.username=${POSTGRES_USERNAME:postgres}
banking.postgres.password=${POSTGRES_PASSWORD:}
banking.mongo.uri=${MONGO_URI:mongodb://localhost:27017/?serverSelectionTimeoutMS=5000}
banking.mongo.database=${MONGO_DATABASE:banking_spring_address}

# Isolate this app from session cookies used by other localhost applications.
server.servlet.session.cookie.name=BANKING_SPRING_SESSION

banking.admin.username=${ADMIN_USERNAME:admin}
banking.admin.password=${ADMIN_PASSWORD:}
spring.jpa.open-in-view=false
